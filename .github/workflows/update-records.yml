name: Update records index

# Rebuilds data/records.json from AARO's DVIDS uploads and publishes it on
# GitHub Pages, so new PURSUE release tranches reach the app without an update.
on:
  schedule:
    - cron: "17 14 * * *" # daily, 14:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-records
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build records index
        env:
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
        run: python3 tools/build_records.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/records.json; then
            echo "No new records."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data/records.json
            git commit -m "data: refresh records index from DVIDS"
            git push
          fi

      - name: Stage site
        run: mkdir -p _site/data && cp data/records.json _site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
